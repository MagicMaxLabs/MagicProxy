name: Release

# Push a tag like v0.1.0 to build the host, bundle sing-box, compile the
# installer, and publish everything to GitHub Releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance to sign via Sigstore.
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          # The host has no third-party dependencies, so there is no go.sum and
          # nothing to cache. Without this, every run logs a "cache failed" warning.
          cache: false

      # Everything downstream stamps this version, so it is derived once, here.
      # Without it every release reported 0.1.0 — and the Chrome Web Store rejects
      # an upload whose version is not strictly greater than the previous one.
      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag '${{ github.ref_name }}' is not a version" }
          Write-Host "Version: $v"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp extension manifest
        shell: pwsh
        run: |
          $p = "extension/manifest.json"
          # -Encoding UTF8 on BOTH ends: PS 5.1 reads as ANSI otherwise and mangles
          # the em dash in the extension name.
          $m = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
          $m.version = "${{ steps.ver.outputs.version }}"
          $json = $m | ConvertTo-Json -Depth 20
          [System.IO.File]::WriteAllText((Resolve-Path $p), $json, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $p -Raw -Encoding UTF8 | Select-String '"version"'

      - name: Build native host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor-bin | Out-Null
          Push-Location native-host
          go build -trimpath -ldflags "-X main.hostVersion=${{ steps.ver.outputs.version }}" -o ../vendor-bin/magicproxy-host.exe ./cmd/host
          Pop-Location

      # The version is PINNED, not "latest". Two reasons: a floating core silently
      # changes what we ship, and GPLv3 §6 requires offering the source for the exact
      # version conveyed — which is impossible if the version drifts per build.
      - name: Download pinned sing-box core
        shell: pwsh
        run: |
          $tag = (Get-Content third-party/sing-box/VERSION -Raw).Trim()
          Write-Host "Pinned sing-box: $tag"
          $headers = @{ "User-Agent" = "MagicProxy-CI" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/SagerNet/sing-box/releases/tags/$tag" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -match "windows-amd64\.zip$" -and $_.name -notmatch "legacy" } | Select-Object -First 1
          if (-not $asset) { throw "No windows-amd64 asset for sing-box $tag" }
          $zip = "$env:TEMP/sing-box.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -Headers $headers
          $tmp = "$env:TEMP/sb"
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem -Path $tmp -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "vendor-bin/sing-box.exe" -Force
          # Fail loudly if the binary does not report the version we pinned.
          $reported = (& "vendor-bin/sing-box.exe" version | Select-Object -First 1)
          Write-Host "Reported: $reported"
          if ($reported -notmatch [regex]::Escape($tag.TrimStart('v'))) {
            throw "sing-box reports '$reported' but $tag was pinned"
          }

      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # The output filename stays MagicProxy-Setup.exe on purpose: the extension's
          # onboarding links to .../releases/latest/download/MagicProxy-Setup.exe, and
          # that stable URL is what makes the download work without hunting.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\magicproxy.iss

      - name: Assemble portable bundle (zip)
        shell: pwsh
        run: |
          $d = "dist/MagicProxy"
          New-Item -ItemType Directory -Force -Path "$d/vendor-bin" | Out-Null
          Copy-Item -Recurse extension "$d/extension"
          Copy-Item setup.ps1, setup.bat, uninstall.bat, README.md, LICENSE, SECURITY.md, PRIVACY.md "$d/"
          # Only the documents a user of the bundle actually needs. This used to copy
          # docs/ wholesale, which shipped the release checklist, the go-to-market
          # plan and the internal state notes to everyone who downloaded the zip.
          New-Item -ItemType Directory -Force -Path "$d/docs" | Out-Null
          Copy-Item docs/HOW-IT-WORKS.md "$d/docs/"
          # GPLv3 §6: the licence text and source pointer travel with the binary.
          Copy-Item -Recurse third-party "$d/third-party"
          Copy-Item "vendor-bin/magicproxy-host.exe", "vendor-bin/sing-box.exe" "$d/vendor-bin/"
          # Do not ship private keys or dev-only tooling.
          if (Test-Path "$d/extension/tools") { Remove-Item -Recurse -Force "$d/extension/tools" }
          # Build the zip with forward-slash entry names (Compress-Archive on Windows
          # PowerShell writes backslashes, which is not what the ZIP spec mandates).
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = (Resolve-Path .).Path + "\MagicProxy-windows-amd64.zip"
          if (Test-Path $out) { Remove-Item $out -Force }
          $zip = [System.IO.Compression.ZipFile]::Open($out, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            $base = (Resolve-Path $d).Path
            Get-ChildItem -Recurse -File $base | ForEach-Object {
              $rel = $_.FullName.Substring($base.Length + 1) -replace '\\', '/'
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $rel) | Out-Null
            }
          } finally { $zip.Dispose() }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @("installer/Output/MagicProxy-Setup.exe", "MagicProxy-windows-amd64.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      # Cryptographic build provenance. On the Free plan this is available for
      # PUBLIC repositories only, so it is skipped while the repo is private —
      # otherwise the whole release job would fail on a test tag.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            installer/Output/MagicProxy-Setup.exe
            MagicProxy-windows-amd64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/MagicProxy-Setup.exe
            MagicProxy-windows-amd64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body_path: .github/release-body.md
          append_body: true
